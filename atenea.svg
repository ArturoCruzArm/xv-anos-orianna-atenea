<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-label="XV Años Orianna Atenea García Loera">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1b2a63"/>
      <stop offset="45%" stop-color="#26317a"/>
      <stop offset="100%" stop-color="#070b1f"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f9ff"/>
      <stop offset="38%" stop-color="#bcc8e4"/>
      <stop offset="62%" stop-color="#eaf0fb"/>
      <stop offset="100%" stop-color="#8f9dc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#6fbcf0" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#6fbcf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fa8e0" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#8fd8f5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5fa8e0" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="720" height="900" fill="url(#bg)"/>
  <rect width="720" height="900" fill="url(#glow)"/>

  <!-- olas hydro -->
  <g fill="none" stroke="url(#wave)" stroke-width="2">
    <path d="M-20 640 q 90 -34 185 0 t 185 0 t 185 0 t 185 0"/>
    <path d="M-20 690 q 90 34 185 0 t 185 0 t 185 0 t 185 0" opacity="0.75"/>
    <path d="M-20 742 q 90 -30 185 0 t 185 0 t 185 0 t 185 0" opacity="0.5"/>
    <path d="M-20 794 q 90 30 185 0 t 185 0 t 185 0 t 185 0" opacity="0.3"/>
  </g>

  <!-- burbujas -->
  <g fill="#a8dcf7">
    <circle cx="118" cy="726" r="4" opacity="0.55"/>
    <circle cx="212" cy="784" r="2.6" opacity="0.4"/>
    <circle cx="556" cy="700" r="3.4" opacity="0.5"/>
    <circle cx="628" cy="770" r="2.2" opacity="0.35"/>
    <circle cx="392" cy="820" r="3" opacity="0.3"/>
  </g>

  <!-- destellos del vestido -->
  <g fill="#eaf0fb">
    <circle cx="92"  cy="120" r="2.2" opacity="0.8"/>
    <circle cx="640" cy="96"  r="1.8" opacity="0.7"/>
    <circle cx="558" cy="188" r="2.6" opacity="0.55"/>
    <circle cx="150" cy="236" r="1.6" opacity="0.6"/>
    <circle cx="672" cy="300" r="2"   opacity="0.45"/>
    <circle cx="60"  cy="384" r="1.7" opacity="0.5"/>
    <circle cx="248" cy="150" r="1.4" opacity="0.45"/>
    <circle cx="470" cy="252" r="1.5" opacity="0.4"/>
  </g>

  <!-- encaje plateado inferior, como el del vestido -->
  <g fill="none" stroke="url(#silver)" stroke-width="1.1" opacity="0.42">
    <path d="M104 858 q 26 -46 52 0 q 26 -46 52 0"/>
    <path d="M260 858 q 26 -46 52 0 q 26 -46 52 0"/>
    <path d="M416 858 q 26 -46 52 0 q 26 -46 52 0"/>
    <path d="M572 858 q 26 -46 52 0"/>
    <path d="M130 858 q 13 -26 26 -40 q 13 14 26 40"/>
    <path d="M286 858 q 13 -26 26 -40 q 13 14 26 40"/>
    <path d="M442 858 q 13 -26 26 -40 q 13 14 26 40"/>
  </g>

  <!-- marco -->
  <rect x="46" y="46" width="628" height="808" rx="18" fill="none" stroke="url(#silver)" stroke-width="1.6" opacity="0.75"/>
  <rect x="60" y="60" width="600" height="780" rx="12" fill="none" stroke="url(#silver)" stroke-width="0.8" opacity="0.4"/>

  <!-- esquinas -->
  <g stroke="url(#silver)" stroke-width="1.8" fill="none" opacity="0.9">
    <path d="M46 104 L46 64 Q46 46 64 46 L104 46"/>
    <path d="M616 46 L656 46 Q674 46 674 64 L674 104"/>
    <path d="M674 796 L674 836 Q674 854 656 854 L616 854"/>
    <path d="M104 854 L64 854 Q46 854 46 836 L46 796"/>
  </g>

  <text x="360" y="196" text-anchor="middle" font-family="Lato, Helvetica, Arial, sans-serif"
        font-size="24" letter-spacing="11" fill="#c3cde6">MIS XV AÑOS</text>

  <!-- monograma -->
  <circle cx="360" cy="360" r="118" fill="none" stroke="url(#silver)" stroke-width="1.4" opacity="0.6"/>
  <circle cx="360" cy="360" r="132" fill="none" stroke="url(#silver)" stroke-width="0.7" opacity="0.32"/>
  <text x="360" y="424" text-anchor="middle" font-family="Playfair Display, Georgia, serif"
        font-size="176" font-weight="700" fill="url(#silver)">A</text>

  <text x="360" y="546" text-anchor="middle" font-family="Playfair Display, Georgia, serif"
        font-size="58" fill="#f3f6fc">Orianna Atenea</text>
  <text x="360" y="592" text-anchor="middle" font-family="Lato, Helvetica, Arial, sans-serif"
        font-size="25" letter-spacing="8" fill="#c3cde6">GARCÍA LOERA</text>

  <g opacity="0.85">
    <line x1="228" y1="620" x2="336" y2="620" stroke="url(#silver)" stroke-width="1.2"/>
    <line x1="384" y1="620" x2="492" y2="620" stroke="url(#silver)" stroke-width="1.2"/>
    <text x="360" y="627" text-anchor="middle" font-family="Lato, Helvetica, Arial, sans-serif"
          font-size="18" fill="#cfdcf0">✦</text>
  </g>

  <text x="360" y="700" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif"
        font-size="40" letter-spacing="5" fill="#eaf0fb">21 · 11 · 2026</text>
</svg>
